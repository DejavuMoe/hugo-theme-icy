name: Build the demo site
description: Install Hugo (checksum-verified), build exampleSite into exampleSite/public, then seal and verify it.

inputs:
  hugo-version:
    description: Hugo version, such as 0.158.0, or "latest".
    default: latest

outputs:
  hugo-version:
    description: The Hugo version that was installed.
    value: ${{ steps.hugo.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install Hugo
      id: hugo
      shell: bash
      env:
        HUGO_VERSION: ${{ inputs.hugo-version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        version="$HUGO_VERSION"
        if [ "$version" = latest ]; then
          version="$(gh api repos/gohugoio/hugo/releases/latest --jq .tag_name)"
        fi
        version="${version#v}"
        file="hugo_${version}_linux-amd64.tar.gz"
        base="https://github.com/gohugoio/hugo/releases/download/v${version}"
        cd "$RUNNER_TEMP"
        curl -fsSLO "$base/$file"
        curl -fsSL "$base/hugo_${version}_checksums.txt" | grep " ${file}\$" | sha256sum -c -
        mkdir -p hugo-bin
        tar -xzf "$file" -C hugo-bin hugo
        echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Build, seal and verify
      shell: bash
      run: |
        set -euo pipefail
        hugo version
        hugo --minify --panicOnWarning -s exampleSite --cleanDestinationDir
        node tools/protect/seal.mjs exampleSite/public
        node tools/protect/verify.mjs exampleSite/public
