version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # CI tooling only; the theme itself has no npm dependencies.
  - package-ecosystem: npm
    directory: /tools/ci
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ci-tooling:
        patterns: ["*"]
