version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Test tooling only; the theme itself has no npm dependencies.
  - package-ecosystem: npm
    directory: /tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      test-tooling:
        patterns: ["*"]
