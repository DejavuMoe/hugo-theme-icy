name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs are independent and run in parallel.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/ci/package-lock.json
      - name: LF line endings
        run: |
          if git ls-files --eol | grep -E '(i|w)/crlf'; then
            echo "::error::These files have CRLF line endings; the repository uses LF."
            exit 1
          fi
      - name: Translation keys
        run: node tools/ci/i18n.mjs
      - run: npm ci --prefix tools/ci
      - name: Biome (JavaScript and CSS)
        run: tools/ci/node_modules/.bin/biome ci --reporter=github

  build:
    name: Build (Hugo ${{ matrix.hugo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release and the newest.
        hugo: ["0.158.0", latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/ci/package-lock.json
      - uses: ./.github/actions/build-site
        with:
          hugo-version: ${{ matrix.hugo }}
      - name: Size budgets
        run: node tools/ci/budget.mjs exampleSite/public
      - name: HTML validation
        if: matrix.hugo == 'latest'
        run: |
          npm ci --prefix tools/ci
          npm run --prefix tools/ci html

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/ci/package-lock.json
      - uses: ./.github/actions/build-site
      - run: npm ci --prefix tools/ci
      - name: Lighthouse CI (scores in the job summary)
        run: npm run --prefix tools/ci lighthouse
      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: tools/ci/lighthouse
          retention-days: 30
