name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: LF line endings
        run: |
          if git ls-files --eol | grep -E '(i|w)/crlf'; then
            echo "::error::These files have CRLF line endings; the repository uses LF."
            exit 1
          fi
      - name: Translation keys
        run: node tools/ci/i18n.mjs
      - run: npm ci --prefix tests
      - name: Biome (JavaScript and CSS)
        run: tests/node_modules/.bin/biome ci --reporter=github

  build:
    name: Build (Hugo ${{ matrix.hugo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release and the newest.
        hugo: ["0.158.0", latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: ./.github/actions/build-site
        with:
          hugo-version: ${{ matrix.hugo }}
      - name: Size budgets
        run: node tools/ci/budget.mjs exampleSite/public
      - name: HTML validation
        if: matrix.hugo == 'latest'
        run: |
          npm ci --prefix tests
          npm run --prefix tests html
      - name: Upload the site
        if: matrix.hugo == 'latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: exampleSite/public
          retention-days: 3

  browsers:
    name: Browsers (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: exampleSite/public
      - run: npm ci --prefix tests
      - name: Install ${{ matrix.browser }}
        working-directory: tests
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Pages, no-JS, features and accessibility
        working-directory: tests
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload the report (screenshots of every page)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ matrix.browser }}
          path: tests/report
          retention-days: 14

  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: exampleSite/public
      - run: npm ci --prefix tests
      - name: Lighthouse CI
        run: npm run --prefix tests lighthouse
      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: tests/lighthouse
          retention-days: 30
