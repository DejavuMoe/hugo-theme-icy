# Icy demo site: the theme's documentation (content/docs) and a showcase of
# every feature (content/posts), in English with a Simplified Chinese
# translation (files named *.zh-cn.md).
#
# Run it from the theme's repository root:
#   hugo server -s exampleSite
# The theme is the repository itself: the module import below is replaced by
# the parent directory (relative to themesDir), so the checkout may have any
# folder name and nothing is downloaded.
baseURL = 'https://icy.zsh.moe/'
title = 'Icy'
themesDir = '..'

defaultContentLanguage = 'en'
# The showcase lives in posts/; docs/ is a plain section (listed by weight).
mainSections = ['posts']
capitalizeListTitles = false
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
# The demo has a password-protected post; local builds and CI seal it with
# tools/protect/seal.mjs, so the "remember to seal" reminder is not needed.
ignoreLogs = ['icy-protected-unsealed']

[module]
  replacements = 'github.com/DejavuMoe/hugo-theme-icy -> .'
  [[module.imports]]
    path = 'github.com/DejavuMoe/hugo-theme-icy'

[languages]
  [languages.en]
    locale = 'en'
    label = 'English'
    weight = 1
    [languages.en.params]
      description = 'Icy — a quiet, fast Hugo theme. This site is its demo and documentation.'
      [languages.en.params.home]
        title = 'Hugo Theme Icy'
        bio = 'A quiet, fast Hugo theme built on native HTML, CSS and JavaScript. This site is its demo and documentation — start with the [docs](/docs/).'
      [languages.en.params.article.copyright]
        note = 'When you repost or quote this post, follow the license: credit the source and make no commercial use.'

  [languages.zh-cn]
    locale = 'zh-CN'
    label = '简体中文'
    weight = 2
    [languages.zh-cn.params]
      description = 'Icy：一个安静、快速的 Hugo 主题。本站是它的演示与文档。'
      languageShort = '中'
      [languages.zh-cn.params.home]
        title = 'Hugo Theme Icy'
        bio = '一个安静、快速的 Hugo 主题，只用原生 HTML、CSS 与 JavaScript。本站是它的演示与文档，可以从 [文档](/docs/) 读起。'
      [languages.zh-cn.params.article.copyright]
        url = 'https://creativecommons.org/licenses/by-nc/4.0/deed.zh-hans'
        note = '转载或引用本文时请遵守许可协议，注明出处，不得用于商业用途。'

# llms.txt / llms-full.txt so an AI assistant can read the whole documentation
# (this site's own templates in layouts/, not a theme feature).
[outputs]
  home = ['html', 'rss', 'llms', 'llmsfull']

[markup]
  [markup.goldmark.parser]
    # Required by the theme: lets stand-alone images render as <figure>.
    wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.parser.attribute]
      block = true          # {.align-center} and friends after a paragraph
  [markup.goldmark.renderer]
    unsafe = true
  # Chinese: a line break inside a paragraph joins the lines without a space.
  [markup.goldmark.extensions.cjk]
    enable = true
    eastAsianLineBreaks = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[caches]
  [caches.getresource]
    # Re-fetch remote data (repo cards, thumbnails) at most once a day.
    maxAge = '24h'

[pagination]
  pagerSize = 10

[taxonomies]
  tag = 'tags'
  category = 'categories'

# Menus per language: only what a visitor to the demo needs (no footer menu;
# [[menus.footer]] is documented in docs/configuration). pageRef resolves to
# the page in the current language.
[languages.en.menus]
  [[languages.en.menus.main]]
    name = 'Docs'
    pageRef = '/docs'
    weight = 10
  [[languages.en.menus.main]]
    name = 'Showcase'
    pageRef = '/posts'
    weight = 20
  [[languages.en.menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 30
  [[languages.en.menus.main]]
    name = 'Users'
    pageRef = '/friends'
    weight = 40

[languages.zh-cn.menus]
  [[languages.zh-cn.menus.main]]
    name = '文档'
    pageRef = '/docs'
    weight = 10
  [[languages.zh-cn.menus.main]]
    name = '示例'
    pageRef = '/posts'
    weight = 20
  [[languages.zh-cn.menus.main]]
    name = '标签'
    pageRef = '/tags'
    weight = 30
  [[languages.zh-cn.menus.main]]
    name = '用户'
    pageRef = '/friends'
    weight = 40

[params]
  images = ['brand/og.png']

  [params.author]
    name = 'Dejavu Moe'
    avatar = 'avatar.png'

  [[params.social]]
    name = 'github'
    title = 'GitHub'
    url = 'https://github.com/DejavuMoe/hugo-theme-icy'
  [[params.social]]
    name = 'rss'
    title = 'RSS'
    url = '/index.xml'

  [params.brand]
    icon = 'brand/icon.png'
  # The note is per language: see [languages.*.params.article.copyright].
  [params.article.copyright]
    license = 'CC BY-NC 4.0'
    url = 'https://creativecommons.org/licenses/by-nc/4.0/'
  [params.search]
    page = '/search'
  [params.schema]
    publisherType = 'Person'
  [params.rss]
    fullText = true
  [params.robots]
    blockAI = false
  [params.friends]
    ref = 'https://icy.zsh.moe'

  [params.footer]
    since = 2026

  # Comments on the demo's own Ecoku site; it allows https://icy.zsh.moe
  # and local previews on ports 1313/1314. A copy of this site needs its own
  # Ecoku site (or remove this block).
  [params.comments]
    provider = 'ecoku'
    [params.comments.ecoku]
      serverURL = 'https://ecoku-dev.zsh.moe'
      siteId = 'hugo-theme-icy'

  # Analytics on the demo's own Plausible CE site; events go to a rewritten
  # endpoint. A copy of this site needs its own Plausible site (or remove
  # this block).
  [params.analytics]
    provider = 'plausible'
    [params.analytics.plausible]
      scriptURL = 'https://stats.via.moe/js/pa--QnqiMbjW-KjHBaUGGEqT.js'
      endpoint = 'https://stats.via.moe/api/resource'

[outputFormats]
  [outputFormats.llms]
    mediaType = 'text/plain'
    baseName = 'llms'
    isPlainText = true
    notAlternative = true
  [outputFormats.llmsfull]
    mediaType = 'text/plain'
    baseName = 'llms-full'
    isPlainText = true
    notAlternative = true
